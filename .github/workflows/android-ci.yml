name: Analyze saved R1.1 Perfetto trace
on:
  push:
    branches: [feature/r11-existing-trace-analysis-27406f4]
permissions:
  contents: read
  actions: read
jobs:
  saved-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45926598413
          name: r11-api35-targeted-trace
          path: prior-trace
      - name: Verify and analyze existing trace bytes
        run: |
          (cd prior-trace && sha256sum -c SHA256SUMS)
          echo 'c22fd144f6edfb0e545b387cfc7a0a2352fbd23bdf46296980e796ec107c2388  prior-trace/r11.pftrace' | sha256sum -c
          python3 -m venv "$RUNNER_TEMP/r11-perfetto"
          "$RUNNER_TEMP/r11-perfetto/bin/pip" install perfetto==0.16.0
          "$RUNNER_TEMP/r11-perfetto/bin/python" .github/scripts/r11-runnable-occupancy.py prior-trace | tee runnable-occupancy.json
          sha256sum runnable-occupancy.json > runnable-occupancy.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-existing-trace-occupancy
          path: |
            runnable-occupancy.json
            runnable-occupancy.sha256
          if-no-files-found: error
