name: GIF paused request interleaving
on:
  push:
    branches: [feature/u1-gif-paused-request-interleaving-20261127]
jobs:
  gif-seek-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_gzPhoneTestInstall: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Assemble diagnostic app and instrumentation
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest --tests '*GifPausedFrameRequestsTest' :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc --sysname-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture baseline and both controlled paused-read outcomes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/u1-gif-paused-request-interleaving.sh
      - name: Upload raw app-side observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u1-gif-paused-request-interleaving
          path: |
            gif-paused-request/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
