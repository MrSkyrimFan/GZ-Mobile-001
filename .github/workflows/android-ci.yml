name: R1.1 paired scheduling diagnostic
on:
  push:
    branches: [feature/r11-final-paired-27406f4]
permissions:
  contents: read
jobs:
  paired-r11:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_gzPhoneTestInstall: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 27406f4aed8efa42a6078e1108c53304d4a0043e
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build exact held application and test binaries
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 27406f4aed8efa42a6078e1108c53304d4a0043e
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare trace reader and the existing KVM lane
        run: |
          python3 -m venv "$RUNNER_TEMP/r11paired"
          "$RUNNER_TEMP/r11paired/bin/pip" install perfetto==0.16.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc --sysname-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run no-app preflight, then at most one paired method
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: '"$RUNNER_TEMP/r11paired/bin/python" .github/scripts/r11-paired-scheduling.py'
      - name: Print disposition and hash raw evidence
        if: always()
        run: |
          mkdir -p r11-paired-receipt
          cd r11-paired-receipt
          if test -f disposition.json; then cat disposition.json; else
            printf '%s\n' '{"instrumentation_invocations":0,"stage":"runner bootstrap","error":"No paired harness disposition was emitted"}' | tee disposition.json
          fi
          if test -f paired/paired-phases.json; then
            python3 -c 'import json; p=json.load(open("paired/paired-phases.json")); print({k:v["wall_ns"] for k,v in p.items()})'
          fi
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../r11paired-sha.txt
          mv ../r11paired-sha.txt SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-api35-paired-scheduling
          path: r11-paired-receipt/
          if-no-files-found: error
