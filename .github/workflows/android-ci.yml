name: U1 Pro Save and GIF route readiness
on:
  push:
    branches: [feature/u1-pro-save-gif-route-targeted]
jobs:
  android-minimum-api29:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_gzPhoneTestInstall: 'true'
      GZ_CI_HEAP_MIB: '256'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify named Pro Save and the actual GIF destination
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          # Runner v2 writes heap-size to hw.heapSize; the AVD key is vm.heapSize.
          # The test script also verifies guest properties after restarting zygote.
          pre-emulator-launch-script: |
            sed -i '/^vm\.heapSize=/d;/^hw\.heapSize=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
            printf 'vm.heapSize=256\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: bash .github/scripts/u1-pro-save-gif-route-targeted.sh
      - name: Upload Android 10 emulator test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u1-pro-save-gif-route-targeted
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
