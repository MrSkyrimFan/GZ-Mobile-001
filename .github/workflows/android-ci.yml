name: R1.1 selected Open attribution
on:
  push:
    branches: [feature/r11-selected-open-probe-20261127]
jobs:
  selected-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      ORG_GRADLE_PROJECT_gzPhoneTestInstall: 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Resolve Kotlin runtime
        run: |
          mkdir -p r11-attribution
          gradle --no-daemon -q :app:dependencyInsight --dependency kotlin-stdlib --configuration debugRuntimeClasspath | tee r11-attribution/app-runtime.txt
          gradle --no-daemon -q :app:dependencyInsight --dependency kotlin-stdlib --configuration debugAndroidTestRuntimeClasspath | tee r11-attribution/test-runtime.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --subsystem-match=misc --sysname-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Measure exact dense selected-Open fixture on API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/r11-selected-open-probe.sh
      - name: Upload attribution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-selected-open-attribution
          path: |
            r11-attribution/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
